version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: dabbawala_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dabbawala_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dabbawala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
    ports:
      # Bind to loopback only; never expose publicly
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dabbawala} -d ${POSTGRES_DB:-dabbawala_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: dabbawala_network

