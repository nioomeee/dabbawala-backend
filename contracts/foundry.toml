[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Test configuration
verbosity = 2
fuzz = { runs = 256, seed = "0x42" }
invariant = { runs = 64, depth = 32 }

# Remappings
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[profile.ci]
fuzz = { runs = 1024, seed = "0x42" }
invariant = { runs = 256, depth = 64 }
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[doc]
out = "docs/contracts"
repository = "https://github.com/dabbawala-protocol/dabbawala-backend"

