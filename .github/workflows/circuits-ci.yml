name: Circuits CI

on:
  push:
    branches: [main]
    paths:
      - "circuits/**"
      - ".github/workflows/circuits-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "circuits/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circom:
    name: Compile Circom circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (required for circom compiler)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: circom-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install circom
        run: cargo install circom

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.1"

      - name: Install snarkjs and circomlib
        run: pnpm install --frozen-lockfile

      - name: Compile MissionCompliance circuit
        run: bash circuits/mission-compliance/scripts/compile.sh

      - name: Run test vectors
        run: bash circuits/mission-compliance/scripts/test.sh

